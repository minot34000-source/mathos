<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d4dbd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151e32" media="(prefers-color-scheme: dark)">
<title>MATHOS</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MATHOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Un cahier d'élève : colonne de lecture étroite, lignes Seyès réservées à la page d'accueil,
   encre bleue pour agir, rouge pour l'erreur, vert pour le juste, ocre pour le coup de pouce.
   Les calculs sont en chasse fixe : + et − prennent la place d'un chiffre et ne se confondent plus. */
:root {
  --papier: #f4f6fb; --feuille: #ffffff; --encre: #14213a; --gris: #56627e; --trait: #d3dbeb;
  --bleu: #1d4dbd; --sur-bleu: #ffffff; --bleu-doux: #e5ecfb;
  --rouge: #c02d27; --rouge-doux: #fbe9e7; --vert: #12775a; --vert-doux: #e0f3ea;
  --ocre: #96620a; --ocre-doux: #fbf0d6; --violet: #6238bd; --violet-doux: #eee8fb;
  --titre: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --texte: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --base: 1.0625rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #0d1321; --feuille: #151e32; --encre: #e7ecf8; --gris: #9eabc6; --trait: #2c3855;
  --bleu: #8fb0ff; --sur-bleu: #0d1321; --bleu-doux: #1b294b;
  --rouge: #ff8d83; --rouge-doux: #3a1e21; --vert: #62d3a6; --vert-doux: #143228;
  --ocre: #efbf55; --ocre-doux: #362b11; --violet: #b9a0ff; --violet-doux: #2a2148; color-scheme: dark } }
:root[data-theme="dark"] {
  --papier: #0d1321; --feuille: #151e32; --encre: #e7ecf8; --gris: #9eabc6; --trait: #2c3855;
  --bleu: #8fb0ff; --sur-bleu: #0d1321; --bleu-doux: #1b294b;
  --rouge: #ff8d83; --rouge-doux: #3a1e21; --vert: #62d3a6; --vert-doux: #143228;
  --ocre: #efbf55; --ocre-doux: #362b11; --violet: #b9a0ff; --violet-doux: #2a2148; color-scheme: dark }
:root[data-taille="1"] { --base: 1.19rem } :root[data-taille="2"] { --base: 1.32rem }

*, *::before, *::after { box-sizing: border-box }
body { background: var(--papier); color: var(--encre); font: var(--base)/1.55 var(--texte); -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--feuille) }
.aere body { letter-spacing: .035em; word-spacing: .12em; line-height: 1.85 }
h1, h2, h3 { font-family: var(--titre); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: 1.75em; font-weight: 800; letter-spacing: -.01em } h2 { font-size: 1.22em; font-weight: 700; margin-top: 1.8rem } h3 { font-size: 1.02em; font-weight: 700; margin-top: 1.2rem }
p { margin: .55rem 0 } ul, ol { margin: .5rem 0; padding-left: 1.3rem } li { margin: .25rem 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer } button:disabled { cursor: default }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px }
.sur { font-family: var(--mono); font-size: .76em; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); margin: 0 0 .3rem }
.petit, small { font-size: .86em; color: var(--gris) }
.m { font-family: var(--mono); font-weight: 500; white-space: nowrap; font-size: 1.02em }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 .12em }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em } .fr > span:last-child { padding: 0 .2em }
.gap { display: inline-block; width: 1.6em }
.ic { display: inline-flex; width: 1.15em; height: 1.15em; flex: none } .ic svg { width: 100%; height: 100% }
.defile { overflow-x: auto; max-width: 100% }

/* ---------- Cadre général ---------- */
.haut { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--feuille); border-bottom: 1px solid var(--trait) }
.barre { display: flex; align-items: center; gap: .5rem; max-width: 66rem; margin: 0 auto; padding-block: .45rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.marque { display: inline-flex; align-items: center; gap: .45rem; border: 0; background: none; font: 800 1.05rem var(--titre); letter-spacing: .02em; padding: .2rem }
.logo { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; background: var(--bleu); color: var(--sur-bleu); font: 600 1.05rem var(--mono); border-radius: 6px }
.ongs { display: flex; gap: .15rem; margin-left: auto; background: var(--papier); padding: .2rem; border-radius: 10px }
.ong { border: 0; background: none; padding: .35rem .7rem; border-radius: 8px; font-size: .9rem; font-weight: 700; color: var(--gris) }
.ong[aria-current] { background: var(--feuille); color: var(--encre); box-shadow: 0 0 0 1px var(--trait) }
.mini { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; flex: none; border: 0; background: none; border-radius: 8px; color: var(--gris) } .mini:hover { background: var(--papier); color: var(--encre) }
main { padding-block: 1.4rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
main > * { max-width: 44rem; margin-inline: auto } main > .large { max-width: 64rem } main > section, main > .hero { margin-top: 1.4rem }
.pied { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; justify-content: space-between; max-width: 66rem; margin: 0 auto; padding-block: 1rem 1.6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: .8rem; color: var(--gris) }
.attente { display: grid; place-items: center; gap: .6rem; min-height: 50vh; color: var(--gris) } .attente .logo { width: 3rem; height: 3rem; font-size: 1.8rem }
.rang { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1rem } .rang.bas { margin-top: 1.6rem }
.deux { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); margin-top: 1rem; align-items: start }
.note { background: var(--bleu-doux); padding: .7rem .9rem; border-radius: 10px; font-size: .95em }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; gap: .45rem; padding: .55rem 1rem; border: 1.5px solid var(--trait); border-radius: 10px; background: var(--feuille); font-weight: 700; font-size: .95em; text-align: left }
.btn:hover:not(:disabled) { border-color: var(--bleu) }
.btn.pri { background: var(--bleu); border-color: var(--bleu); color: var(--sur-bleu) } .btn.pri:hover { filter: brightness(1.08) }
.btn.grand { padding: .8rem 1.25rem; font-size: 1.02em } .btn.danger { color: var(--rouge) }
.btn.ia { display: none; color: var(--violet); border-color: var(--violet); background: var(--violet-doux) }
.avec-ia:not(.tuteur-non) .btn.ia:not([hidden]) { display: inline-flex }
.mini.tts, .mini.com { display: none; width: 2.1rem; height: 2.1rem } .avec-tts .mini.tts, .avec-com .mini.com { display: inline-grid }
.lien { border: 0; background: none; padding: 0; color: var(--bleu); font-weight: 700; text-decoration: underline; text-underline-offset: 3px }
.badge, .tag { display: inline-block; font: 600 .74em var(--mono); letter-spacing: .03em; padding: .18rem .5rem; border-radius: 6px; background: var(--bleu-doux); color: var(--bleu) }
.tag { background: var(--papier); color: var(--gris); border: 1px solid var(--trait) } .tag.n1 { color: var(--vert) } .tag.n2 { color: var(--bleu) } .tag.n3 { color: var(--violet) }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; margin: .3rem 0 0 }

/* ---------- Accueil ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 1rem 1.5rem; align-items: center; padding: 1.5rem 1.4rem 1.5rem 3.1rem; border: 1px solid var(--trait); border-radius: 4px;
  background:
    linear-gradient(90deg, transparent 2.05rem, color-mix(in srgb, var(--rouge) 55%, transparent) 2.05rem, color-mix(in srgb, var(--rouge) 55%, transparent) calc(2.05rem + 1.5px), transparent calc(2.05rem + 1.5px)),
    repeating-linear-gradient(0deg, transparent 0 1.95rem, color-mix(in srgb, var(--bleu) 26%, transparent) 1.95rem 2rem),
    repeating-linear-gradient(0deg, transparent 0 .47rem, color-mix(in srgb, var(--bleu) 9%, transparent) .47rem .5rem), var(--feuille) }
.hero h1 { font-size: clamp(1.6rem, 5vw, 2.3rem) } .salut { max-width: 34rem }
.anneau { width: 7.2rem } .anneau svg { display: block; width: 100% }
.anneau .fond { fill: var(--feuille); stroke: var(--trait); stroke-width: 9 } .anneau .arc { fill: none; stroke: var(--bleu); stroke-width: 9; stroke-linecap: round }
.anneau text { text-anchor: middle; fill: var(--encre); font: 800 24px var(--titre) } .anneau text.p { font: 400 10.5px var(--texte); fill: var(--gris) }
.jour { display: flex; align-items: center; gap: .7rem; width: 100%; margin-top: 1rem; padding: .8rem 1rem; border: 1.5px dashed var(--ocre); background: var(--ocre-doux); border-radius: 10px; text-align: left } .jour > span:nth-child(2) { flex: 1; min-width: 0 }
.parc { margin: .6rem 0 }
.chemin, .liste, .biblio { list-style: none; padding: 0; margin: .7rem 0 0 }
.chemin li, .liste li { border-top: 1px solid var(--trait) } .chemin li:last-child, .liste li:last-child { border-bottom: 1px solid var(--trait) }
.chemin button, .liste button, .liste .item { display: grid; grid-template-columns: auto 1fr auto auto; gap: .8rem; align-items: center; width: 100%; padding: .75rem .3rem; border: 0; background: none; text-align: left }
.chemin button:hover, .liste button:hover { background: var(--feuille) }
.rond { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1.5px solid var(--trait); font: 600 .9rem var(--mono); color: var(--gris); background: var(--feuille) }
.fait .rond, .rond.ok { background: var(--vert-doux); border-color: var(--vert); color: var(--vert) } .encours .rond { border-color: var(--bleu); color: var(--bleu) }
.due .rond { border-color: var(--ocre); color: var(--ocre); background: var(--ocre-doux) }
.corps { display: grid; gap: .1rem; min-width: 0 } .corps .sous { font-size: .86em; color: var(--gris) }
.etat, .chif { font: 500 .84em var(--mono); color: var(--gris); font-variant-numeric: tabular-nums; white-space: nowrap } .due .etat { color: var(--ocre); font-weight: 700 } .chif.note { font-size: 1em; color: var(--encre) }
.chemin .ic:last-child, .liste button > .ic:last-child { color: var(--gris) }
.jauge { display: block; height: 5px; background: var(--trait); border-radius: 3px; overflow: hidden; margin-top: .3rem; max-width: 14rem } .jauge > span { display: block; height: 100%; background: var(--bleu) }
.biblio li { display: flex; gap: .6rem; align-items: baseline; padding: .4rem 0; border-top: 1px solid var(--trait) } .nch { font: 500 .8em var(--mono); color: var(--gris); width: 1.5rem; flex: none }
.avenir, .charge { margin-left: auto; font: 500 .74em var(--mono); color: var(--gris); white-space: nowrap } .charge { color: var(--vert) }

/* ---------- Cartes et blocs de cours ---------- */
.carte { background: var(--feuille); border: 1px solid var(--trait); border-radius: 12px; padding: 1.1rem 1.2rem; margin-top: 1rem } .carte > :first-child { margin-top: 0 } .carte h2 { margin-top: 0 }
.carte.accent { background: var(--bleu-doux); border-color: transparent } .carte.situation { background: var(--papier); border-style: dashed }
.carte.score { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center } .gros { font: 400 1.1rem var(--titre); margin: 0; white-space: nowrap } .gros b { font-size: 2.6rem; font-weight: 800; color: var(--bleu) }
.bloc { --c: var(--gris); margin-top: 1.1rem; padding: .2rem 1rem .8rem; border-top: 2.5px solid var(--c); background: color-mix(in srgb, var(--c) 7%, var(--feuille)) }
.bloc.def, .bloc.pro { --c: var(--bleu) } .bloc.met { --c: var(--vert) } .bloc.err { --c: var(--rouge) } .bloc.vig { --c: var(--ocre) } .bloc.bil { --c: var(--encre) }
.etq { display: inline-block; margin: 0 0 .2rem; padding: .12rem .5rem; transform: translateY(-.85rem); background: var(--c); color: var(--feuille); font: 600 .74em var(--mono); letter-spacing: .04em; text-transform: uppercase }
.bloc .txt { margin-top: -.5rem } .cadre .lien { display: inline-block; margin-top: .5rem }
.fj p { margin: .25rem 0 } .fauxl b { color: var(--rouge) } .justel b { color: var(--vert) } .fauxl .m { text-decoration: line-through; text-decoration-color: var(--rouge) }
.exs { border-collapse: collapse; margin-top: -.3rem } .exs td { padding: .3rem .9rem .3rem 0; vertical-align: baseline } .exs .com { color: var(--gris); font-size: .9em; font-style: italic }
.lignes { font-size: 1.05em; line-height: 1.9; margin: .4rem 0; padding-left: .2rem }
.jesais { color: var(--gris); font-style: italic }
.onglets { display: flex; gap: .35rem; overflow-x: auto; padding: .2rem 0 .5rem; margin-top: .8rem }
.onglets button { display: inline-flex; align-items: center; gap: .3rem; flex: none; padding: .35rem .8rem; border: 1.5px solid var(--trait); border-radius: 999px; background: var(--feuille); font: 600 .86rem var(--mono) }
.onglets button[aria-current] { background: var(--encre); border-color: var(--encre); color: var(--papier) } .onglets .ic { color: var(--vert); width: 1em; height: 1em } .onglets [aria-current] .ic { color: inherit }
.figure { margin: 1rem 0; overflow-x: auto } .figure figcaption { font-size: .86em; color: var(--gris); font-style: italic; margin-top: .3rem }
.fig { display: block; width: 100%; height: auto } .fig.haute { max-height: 26rem }
.fig .axe { stroke: var(--encre); stroke-width: 1.4; fill: var(--encre) } .fig text { font: 500 12.5px var(--mono); fill: var(--gris); text-anchor: middle } .fig text.d { text-anchor: end } .fig text.g { text-anchor: start; font-style: italic }
.fig text.zero { fill: var(--encre); font-weight: 700 } .fig text.nom { fill: var(--bleu); font-weight: 700; font-size: 14px } .fig text.nom.r { fill: var(--rouge) } .fig text.nom.v { fill: var(--vert) } .fig text.fort { fill: var(--ocre); font-weight: 700 } .fig text.bleu { fill: var(--bleu) }
.fig .pt { fill: var(--bleu) } .fig .pt.r { fill: var(--rouge) } .fig .pt.v { fill: var(--vert) } .fig .arc { fill: none; stroke: var(--gris); stroke-width: 1.2; stroke-dasharray: 4 3 } .fig .saut { fill: none; stroke: var(--ocre); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.fig .eau { fill: var(--bleu-doux) } .fig .surface { stroke: var(--bleu); stroke-width: 2.5 } .fig .pont { stroke: var(--encre); stroke-width: 3 } .fig .echelle { fill: none; stroke: var(--gris); stroke-width: 1.3 } .fig .cable { stroke: var(--gris); stroke-width: 1.3; stroke-dasharray: 5 4 }
table { font-variant-numeric: tabular-nums }
.tsig, .tmul, .donnees, .tab { border-collapse: collapse; margin: .6rem 0; font-family: var(--mono); font-size: .9em }
.tsig th, .tsig td, .tmul th, .tmul td, .donnees th, .donnees td { border: 1px solid var(--trait); padding: .3rem .6rem; text-align: center } .tmul th, .tmul td { padding: .2rem .35rem; min-width: 2.3rem }
.tsig th, .tmul th, .donnees th { background: var(--papier); font-weight: 600 } .pos { background: var(--vert-doux); color: var(--vert) } .neg { background: var(--rouge-doux); color: var(--rouge) } .nul { color: var(--gris) }
.script { font: 500 .88em/1.7 var(--mono); background: var(--papier); border: 1px solid var(--trait); padding: .8rem 1rem; overflow-x: auto; white-space: pre }
.lexique { display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: .3rem 1rem; margin: .6rem 0 } .lexique dt { font-weight: 700 } .lexique dd { margin: 0; color: var(--gris) }
.plie { margin-top: 1rem } .plie summary { cursor: pointer; font-weight: 700; color: var(--bleu) }

/* ---------- Questions ---------- */
.q { background: var(--feuille); border: 1px solid var(--trait); border-radius: 12px; padding: .9rem 1rem; margin-top: .8rem }
.enonce { display: flex; gap: .6rem; align-items: flex-start } .enonce .txt { flex: 1; min-width: 0; font-size: 1.04em } .numq { font: 600 .82em var(--mono); color: var(--gris); padding-top: .2rem; min-width: 1.4rem }
.q[data-k="calc"] .enonce .m, .q[data-k="qcmc"] .enonce .m, .q[data-k="trou"] .enonce .m { font-size: 1.22em }
.ctl { margin-top: .7rem } .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .7rem; align-items: center } .actions .com { margin-left: auto }
.nbr { display: inline-flex; border: 2px solid var(--trait); border-radius: 10px; overflow: hidden; background: var(--feuille) } .nbr:focus-within { border-color: var(--bleu) }
.nbr .sg { width: 2.7rem; border: 0; border-right: 2px solid var(--trait); background: var(--papier); font: 600 1.3rem var(--mono); color: var(--gris) } .nbr .sg.moins { background: var(--rouge-doux); color: var(--rouge) }
.nbr input { width: 7.2rem; max-width: 40vw; border: 0; background: none; padding: .5rem .7rem; font: 500 1.2rem var(--mono); outline: none } .nbr.juste { border-color: var(--vert) } .nbr.faux { border-color: var(--rouge) }
.choixs { display: grid; gap: .45rem } .choixs.ligne, .choixs.cmp { display: flex; flex-wrap: wrap }
.choix { padding: .55rem .9rem; border: 2px solid var(--trait); border-radius: 10px; background: var(--feuille); text-align: left; min-width: 3.4rem }
.choix[aria-pressed="true"] { border-color: var(--bleu); background: var(--bleu-doux) } .choix.bon { border-color: var(--vert); background: var(--vert-doux) }
.q.faux .choix[aria-pressed="true"]:not(.bon) { border-color: var(--rouge); background: var(--rouge-doux) } .choix:disabled { opacity: .85 }
.choix.cmp { font: 600 1.2rem var(--mono); text-align: center } .cmpl { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; font-size: 1.2em }
.just { margin-top: .7rem; padding-top: .6rem; border-top: 1px dashed var(--trait) }
.ordre .rangee { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; min-height: 2.9rem; padding: .3rem 0 } .ordre .rangee:first-child { border-bottom: 2px solid var(--trait); margin-bottom: .3rem }
.jeton { padding: .4rem .7rem; border: 2px solid var(--trait); border-radius: 8px; background: var(--feuille) } .jeton.pris { border-color: var(--bleu); background: var(--bleu-doux) } .sep { font-family: var(--mono); color: var(--gris) } .vide { color: var(--gris); font-size: .9em }
.frs { display: inline-grid; gap: .25rem; justify-items: center } .frs input { width: 4.2rem; text-align: center; border: 2px solid var(--trait); border-radius: 8px; padding: .35rem; background: var(--feuille); font: 500 1.1rem var(--mono) }
.traitfr { display: block; width: 100%; height: 2px; background: var(--encre) }
.tab td, .tab th { padding: .3rem .8rem .3rem 0; text-align: left; font-family: var(--texte) } .tab th { font-size: .82em; color: var(--gris); font-weight: 600 } .tab .donne { font-size: 1.15em; padding-left: 3.4rem }
textarea { width: 100%; border: 2px solid var(--trait); border-radius: 10px; padding: .6rem .7rem; background: var(--feuille); resize: vertical } .modele { margin-top: .6rem; padding: .6rem .8rem; background: var(--bleu-doux); border-radius: 10px }
.fb { display: flex; gap: .5rem; align-items: flex-start; margin-top: .7rem; font-weight: 600 } .fb:empty { display: none } .fb.ok { color: var(--vert) } .fb.ko { color: var(--rouge) } .fb.info { color: var(--gris); font-weight: 400 } .fb .ic { margin-top: .15rem }
.aide { margin-top: .6rem; padding: .6rem .8rem; background: var(--ocre-doux); border-radius: 10px } .niv { display: block; font: 600 .72em var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ocre); margin-bottom: .15rem }
.cor { margin-top: .7rem; padding: .7rem .9rem; background: var(--bleu-doux); border-radius: 10px } .cor p { margin: .3rem 0 } .rep { font-weight: 700 }
.sec { margin-top: 1.6rem } .sec h2 { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: baseline } .pts { font: 500 .72em var(--mono); color: var(--gris) }

<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<script>
window.MATHOS_EDITION = 'externe';
/* MATHOS — calcul exact sur les nombres relatifs.
   Tout résultat affiché à l'élève passe par ce module : aucune réponse n'est saisie à la main. */
(function (root) {
  'use strict';
  const MOINS = '−';
  const B = BigInt;

  // ---------- Rationnels exacts ----------
  const pgcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
  function R(n, d = 1n) {
    n = B(n); d = B(d);
    if (d === 0n) throw new Error('division par zéro');
    if (d < 0n) { n = -n; d = -d; }
    const g = pgcd(n, d) || 1n;
    return { n: n / g, d: d / g };
  }
  const add = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const neg = a => R(-a.n, a.d);
  const sub = (a, b) => add(a, neg(b));
  const mul = (a, b) => R(a.n * b.n, a.d * b.d);
  const div = (a, b) => { if (b.n === 0n) throw new Error('division par zéro'); return R(a.n * b.d, a.d * b.n); };
  const eq = (a, b) => a.n === b.n && a.d === b.d;
  const sgn = a => (a.n > 0n ? 1 : a.n < 0n ? -1 : 0);
  const abs = a => R(a.n < 0n ? -a.n : a.n, a.d);
  const cmp = (a, b) => { const x = a.n * b.d - b.n * a.d; return x > 0n ? 1 : x < 0n ? -1 : 0; };
  const versNombre = a => Number(a.n) / Number(a.d);
  const entier = x => R(B(x));

  function decimale(a) {            // écriture décimale française d'un rationnel positif, ou null
    let t = a.d, c2 = 0, c5 = 0;
    while (t % 2n === 0n) { t /= 2n; c2++; }
    while (t % 5n === 0n) { t /= 5n; c5++; }
    if (t !== 1n) return null;
    const k = Math.max(c2, c5);
    let s = (a.n * 10n ** B(k) / a.d).toString();
    if (k > 0) { s = s.padStart(k + 1, '0'); s = s.slice(0, -k) + ',' + s.slice(-k); }
    return s;
  }
  /** Écrit un rationnel. plus : écrire « + » devant un positif ; par : parenthèses autour d'un négatif. */
  function ecrire(a, o = {}) {
    const s = sgn(a), v = abs(a);
    const corps = decimale(v) ?? `{${v.n}/${v.d}}`;
    const t = (s < 0 ? MOINS : o.plus && s > 0 ? '+' : '') + corps;
    return o.par && s < 0 ? '(' + t + ')' : t;
  }

  /** Lit une réponse d'élève : « -5 », « −5 », « (+5) », « 2,5 », « 2.5 », « 3/4 ». Renvoie un rationnel ou null. */
  function lireNombre(s) {
    if (typeof s !== 'string') return null;
    const t = s.replace(/[−–—]/g, '-').replace(/[\s  ]/g, '');
    let m = t.match(/^\(?([+-]?)(\d+(?:[.,]\d+)?)\)?$/);
    if (m) {
      const [e, f = ''] = m[2].replace('.', ',').split(',');
      const r = R(B(e + f), 10n ** B(f.length));
      return m[1] === '-' ? neg(r) : r;
    }
    m = t.match(/^\(?([+-]?)(\d+)\/([+-]?)(\d+)\)?$/);
    if (m && !/^0+$/.test(m[4])) {
      const r = R(B(m[2]), B(m[4]));
      return (m[1] === '-') !== (m[3] === '-') ? neg(r) : r;
    }
    return null;
  }

  // ---------- Analyse d'une expression ----------
  // Écriture source : + - * : ( ) , décimale ; {a/b} fraction ; ? nombre manquant.
  function analyser(src) {
    const s = String(src).replace(/[−–]/g, '-').replace(/×/g, '*').replace(/÷/g, ':').replace(/\s+/g, '');
    let i = 0;
    const expr = () => { let a = terme(); while (s[i] === '+' || s[i] === '-') { const op = s[i++]; a = { t: 'bin', op, a, b: terme() }; } return a; };
    const terme = () => { let a = fact(); while (s[i] === '*' || s[i] === ':') { const op = s[i++]; a = { t: 'bin', op, a, b: fact() }; } return a; };
    const fact = () => {
      const c = s[i];
      if (c === '+' || c === '-') { i++; return { t: 'un', op: c, a: fact() }; }
      if (c === '(') { i++; const a = expr(); if (s[i++] !== ')') throw new Error('parenthèse non fermée : ' + src); return { t: 'par', a }; }
      if (c === '{') {
        i++; const a = expr(); if (s[i++] !== '/') throw new Error('fraction mal écrite : ' + src);
        const b = expr(); if (s[i++] !== '}') throw new Error('fraction mal écrite : ' + src);
        return { t: 'frac', a, b };
      }
      if (c === '?') { i++; return { t: 'trou' }; }
      const m = /^\d+(?:,\d+)?/.exec(s.slice(i));
      if (!m) throw new Error('nombre attendu : ' + src);
      i += m[0].length;
      const [e, f = ''] = m[0].split(',');
      return { t: 'num', v: R(B(e + f), 10n ** B(f.length)) };
    };
    const a = expr();
    if (i !== s.length) throw new Error('écriture non comprise : ' + src);
    return a;
  }
  const arbre = x => (typeof x === 'string' ? analyser(x) : x);

  function valeur(n, x) {
    n = arbre(n);
    switch (n.t) {
      case 'num': return n.v;
      case 'trou': if (!x) throw new Error('nombre manquant'); return x;
      case 'un': return n.op === '-' ? neg(valeur(n.a, x)) : valeur(n.a, x);
      case 'par': return valeur(n.a, x);
      case 'frac': return div(valeur(n.a, x), valeur(n.b, x));
      default: {
        const a = valeur(n.a, x), b = valeur(n.b, x);
        return n.op === '+' ? add(a, b) : n.op === '-' ? sub(a, b) : n.op === '*' ? mul(a, b) : div(a, b);
      }
    }
  }

  const OPS = { '+': '+', '-': MOINS, '*': '×', ':': '÷' };
  /** Écrit une expression. pos = 'suite' quand le nœud suit un opérateur (un négatif calculé prend alors des parenthèses). */
  function ecrireExpr(n, pos = 'debut') {
    n = arbre(n);
    switch (n.t) {
      case 'num': return ecrire(n.v, { par: pos === 'suite' });
      case 'trou': return '…';
      case 'un': return (n.op === '-' ? MOINS : '+') + ecrireExpr(n.a, 'suite');
      case 'par': return '(' + ecrireExpr(n.a) + ')';
      case 'frac': return '{' + ecrireExpr(n.a) + '/' + ecrireExpr(n.b) + '}';
      default: return ecrireExpr(n.a, pos) + ' ' + OPS[n.op] + ' ' + ecrireExpr(n.b, 'suite');
    }
  }

  // ---------- Calcul pas à pas : « une seule opération par ligne » ----------
  const estVal = n => n.t === 'num' || (n.t === 'un' && n.a.t === 'num') || (n.t === 'par' && estVal(n.a));
  const N = v => ({ t: 'num', v });
  const chaineProduit = m => m.t === 'bin' && m.op === '*' && estVal(m.b) && (estVal(m.a) || chaineProduit(m.a));

  function pasGroupes(n) {          // parenthèses, fractions, opposé d'une parenthèse
    let fait = false;
    const f = m => {
      if (estVal(m)) return m;
      if (m.t === 'par') { fait = true; const r = pas(m.a) || N(valeur(m.a)); return estVal(r) ? N(valeur(r)) : { t: 'par', a: r }; }
      if (m.t === 'frac') { if (estVal(m.a) && estVal(m.b)) { fait = true; return N(valeur(m)); } return { ...m, a: f(m.a), b: f(m.b) }; }
      if (m.t === 'un') { if (estVal(m.a)) { fait = true; return N(valeur(m)); } return { ...m, a: f(m.a) }; }
      if (m.t === 'bin') return { ...m, a: f(m.a), b: f(m.b) };
      return m;
    };
    const r = f(n);
    return fait ? r : null;
  }
  function pasMulDiv(n) {           // multiplications et divisions prêtes, sur la même ligne
    let fait = false;
    const f = m => {
      if (m.t !== 'bin') return m;
      if ((m.op === '*' || m.op === ':') && (chaineProduit(m) || (estVal(m.a) && estVal(m.b)))) { fait = true; return N(valeur(m)); }
      return { ...m, a: f(m.a), b: f(m.b) };
    };
    const r = f(n);
    return fait ? r : null;
  }
  const avecSigne = m => (m.t === 'par' && m.a.t === 'un' && m.a.a.t === 'num') || (m.t === 'num' && sgn(m.v) < 0);
  const opposeEcrit = m => (m.t === 'par' ? { t: 'par', a: { t: 'un', op: m.a.op === '-' ? '+' : '-', a: m.a.a } } : N(neg(m.v)));
  function pasAddSub(n) {           // soustraire = ajouter l'opposé (ligne écrite), puis la somme
    if (n.t !== 'bin') return null;
    let transf = false;
    const f = m => {
      if (m.t !== 'bin' || (m.op !== '+' && m.op !== '-')) return m;
      const a = f(m.a);
      if (m.op === '-' && avecSigne(m.b)) { transf = true; return { t: 'bin', op: '+', a, b: opposeEcrit(m.b) }; }
      return { ...m, a };
    };
    const r = f(n);
    return transf ? r : N(valeur(n));
  }
  const pas = n => pasGroupes(n) || pasMulDiv(n) || pasAddSub(n);

  /** Lignes successives du calcul, de l'énoncé au résultat. */
  function etapes(src) {
    let n = arbre(src);
    const L = [ecrireExpr(n)];
    for (let g = 0; n.t !== 'num' && g < 40; g++) {
      n = pas(n) || N(valeur(n));
      const l = ecrireExpr(n);
      if (l !== L[L.length - 1]) L.push(l);
    }
    return L;
  }

  // ---------- Explications dans les mots du cours ----------
  const sansPar = n => (n.t === 'par' && !estVal(n) ? sansPar(n.a) : n);
  const facteurs = m => (m.t === 'bin' && m.op === '*' ? [...facteurs(m.a), m.b] : [m]);

  /** Nature du calcul : 'add' | 'sub' | 'mul' | 'div' | 'produit' (plusieurs facteurs) | 'chaine' | 'valeur'. */
  function nature(src) {
    const n = sansPar(arbre(src));
    if (estVal(n)) return 'valeur';
    if (n.t === 'frac' && estVal(n.a) && estVal(n.b)) return 'div';
    if (n.t === 'bin' && estVal(n.a) && estVal(n.b)) return { '+': 'add', '-': 'sub', '*': 'mul', ':': 'div' }[n.op];
    if (chaineProduit(n)) return 'produit';
    return 'chaine';
  }
  const operandes = src => { const n = sansPar(arbre(src)); return [valeur(n.a), valeur(n.b)]; };

  function expliquerAddition(a, b) {
    const r = add(a, b);
    if (sgn(a) === 0 || sgn(b) === 0) return 'Ajouter 0 ne change rien.';
    if (sgn(a) === sgn(b)) {
      return `Même signe : j'additionne les distances à zéro (${ecrire(abs(a))} + ${ecrire(abs(b))} = ${ecrire(abs(r))}) et je garde le signe ${sgn(a) < 0 ? MOINS : '+'}.`;
    }
    if (eq(abs(a), abs(b))) return 'Les deux nombres sont opposés : leur somme est 0.';
    const [g, p, loin] = cmp(abs(a), abs(b)) > 0 ? [a, b, a] : [b, a, b];
    return `Signes contraires : la plus grande distance à zéro moins la plus petite (${ecrire(abs(g))} ${MOINS} ${ecrire(abs(p))} = ${ecrire(abs(r))}), et je garde le signe de ${ecrire(loin)}, le nombre le plus éloigné de zéro.`;
  }
  function expliquer(src) {
    const n = sansPar(arbre(src)), k = nature(n);
    if (k === 'valeur' || k === 'chaine') return '';
    if (k === 'produit') {
      const fs = facteurs(n).map(f => valeur(f));
      if (fs.some(f => sgn(f) === 0)) return 'Un des facteurs est 0 : le produit vaut 0.';
      const nb = fs.filter(f => sgn(f) < 0).length;
      const d = fs.map(f => ecrire(abs(f))).join(' × ');
      return `${nb} facteur${nb > 1 ? 's' : ''} négatif${nb > 1 ? 's' : ''} : c'est un nombre ${nb % 2 ? 'impair, le produit est négatif' : 'pair, le produit est positif'}. Distances à zéro : ${d} = ${ecrire(abs(valeur(n)))}.`;
    }
    const [a, b] = operandes(n), r = valeur(n);
    if (k === 'add') return expliquerAddition(a, b);
    if (k === 'sub') return `Soustraire, c'est ajouter l'opposé : j'ajoute ${ecrire(neg(b), { par: true })}. ` + expliquerAddition(a, neg(b));
    if (sgn(r) === 0) return k === 'mul' ? 'Un des facteurs est 0 : le produit vaut 0.' : '0 divisé par un nombre non nul donne 0.';
    const meme = sgn(a) === sgn(b);
    return `${meme ? 'Même signe' : 'Signes contraires'} : le ${k === 'mul' ? 'produit' : 'quotient'} est ${meme ? 'positif' : 'négatif'}. Distances à zéro : ${ecrire(abs(a))} ${k === 'mul' ? '×' : '÷'} ${ecrire(abs(b))} = ${ecrire(abs(r))}.`;
  }

  /** Trois coups de pouce gradués ; aucun ne donne le résultat final. */
  function aides(src) {
    const n = sansPar(arbre(src)), k = nature(n);
    if (k === 'valeur') return [];
    if (k === 'chaine') {
      const L = etapes(n);
      return ['Quel calcul est prioritaire ? Repère-le avant de commencer.',
        'Les parenthèses d\'abord, puis les multiplications et les divisions, puis les additions et les soustractions, de gauche à droite. Une seule opération par ligne.',
        L.length > 2 ? `Première ligne à écrire : $${L[1]}$. Continue.` : 'Recopie le calcul et effectue-le en revenant à la droite graduée.'];
    }
    if (k === 'produit') {
      const fs = facteurs(n).map(f => valeur(f)), nb = fs.filter(f => sgn(f) < 0).length;
      return ['Ne calcule pas tout de suite : compte d\'abord les facteurs négatifs.',
        'Nombre pair de facteurs négatifs : produit positif. Nombre impair : produit négatif.',
        `Il y a ${nb} facteur${nb > 1 ? 's' : ''} négatif${nb > 1 ? 's' : ''}. Trouve le signe, puis multiplie les distances à zéro : $${fs.map(f => ecrire(abs(f))).join(' × ')}$.`];
    }
    const [a, b] = operandes(n);
    if (k === 'add') {
      const meme = sgn(a) === sgn(b);
      return ['C\'est une addition. Les deux nombres ont-ils le même signe, ou des signes contraires ?',
        meme ? 'Même signe : on additionne les distances à zéro et on garde le signe commun.'
          : 'Signes contraires : on soustrait la plus petite distance à zéro de la plus grande, et on garde le signe du nombre le plus éloigné de zéro.',
        meme ? `Calcule $${ecrire(abs(a))} + ${ecrire(abs(b))}$, puis écris le signe commun devant.`
          : `Distances à zéro : ${ecrire(abs(a))} et ${ecrire(abs(b))}. Calcule la plus grande moins la plus petite, puis choisis le signe.`];
    }
    if (k === 'sub') {
      const t = n.t === 'bin' ? pasAddSub(n) : null;
      const ligne = t && t.t === 'bin' ? ecrireExpr(t) : `${ecrire(a)} + ${ecrire(neg(b), { par: true })}`;
      return ['C\'est une soustraction. Par quelle addition peux-tu la remplacer ?',
        'Soustraire un nombre, c\'est ajouter son opposé. On transforme d\'abord, on calcule ensuite.',
        `Écris : $${ecrireExpr(n)} = ${ligne}$. Il reste une addition.`];
    }
    const meme = sgn(a) === sgn(b), nul = sgn(a) === 0 || sgn(b) === 0;

        q('Le produit $(-2) * (-3) * (-5) * (+4)$ est :', ['positif', 'négatif', 'nul', 'on ne peut pas savoir sans calculer'], 1, 'O5', { cor: 'Trois facteurs négatifs : c\'est un nombre impair, le produit est négatif.' }),
        q('Quel est le plus grand de ces quatre nombres ?', ['$-6$', '$-15$', '$-10$', '$-4$'], 3, 'O1', { cor: 'Le plus grand est le plus à droite sur la droite graduée : $-4$.' }),

    // Le point sur mes automatismes : 8 questions, 10 minutes, 3 passages (le jour J, une semaine après, trois semaines après)
    point: { types: ['add_meme', 'add_contr', 'sub', 'mul', 'div', 'comparer', 'facteurs', 'prio'], seuil: 8 * 0.75, graines: [4101, 4202, 4303], ecarts: [0, 7, 21], longue: 60 },
    reflexes: [
      'Devant une **addition**, je reviens à la droite graduée. La règle des signes n\'a rien à y faire.',
      '**Soustraire**, c\'est ajouter l\'opposé : je transforme d\'abord, je calcule ensuite.',
      'Pour un **produit** ou un **quotient** : je cherche le signe d\'abord, les chiffres ensuite.',
      'Plusieurs facteurs : je **compte** les facteurs négatifs. Pair → positif, impair → négatif.',
      'Dans un enchaînement : parenthèses, puis $*$ et $:$, puis $+$ et $-$.',
    ],

    // ------------------------------------------------------------------ Je m'entraîne : 16 exercices
    exercices: [
      { id: 'e1', n: 1, titre: 'Additions et soustractions', niv: 1, consigne: 'Calcule.', items: [c('(-13)+(-9)', 'O2'), c('(+17)+(-25)', 'O2'), c('(-31)-(-14)', 'O3'), c('(+8)-(+23)', 'O3'), c('(-4,5)+(+7,5)', 'O2'), c('(-2,3)-(+1,7)', 'O3')] },
      { id: 'e2', n: 2, titre: 'Opposés et comparaison', niv: 1, consigne: 'Donne l\'opposé de chaque nombre, range, puis compare.', items: [opp('-15'), opp('4,2'), opp('0'), opp('-0,1'),
        ord('Range dans l\'ordre **décroissant**.', ['-3', '5', '-11', '0,5', '-0,2'], 'decroissant', 'O1'),
        cmp('-7', '-2', 'O1'), cmp('-1', '0', 'O1'), cmp('-8', '-9', 'O1', { fb: 'Tu as comparé les distances à zéro. Trace une droite graduée : $-8$ est à droite de $-9$.' }), cmp('0', '-0,5', 'O1')] },
      { id: 'e3', n: 3, titre: 'Produits', niv: 1, consigne: 'Calcule. Le signe d\'abord, les chiffres ensuite.', items: [c('(-8)*(+7)', 'O4'), c('(-6)*(-12)', 'O4'), c('(+15)*(-4)', 'O4'), c('(-9)*(-9)', 'O4'), c('(-2,5)*(+4)', 'O4'), c('(-0,5)*(-6)', 'O4')] },
      { id: 'e4', n: 4, titre: 'Quotients', niv: 1, consigne: 'Calcule.', items: [c('(-72):(+8)', 'O6'), c('(-96):(-12)', 'O6'), c('(+150):(-25)', 'O6'), c('{-49/-7}', 'O6'), c('(-7,2):(+9)', 'O6'),
        c('0:(-4)', 'O6', { cor: '$0 : (-4) = 0$. En revanche, $(-4) : 0$ n\'existe pas : on ne peut jamais diviser par 0.' })] },
      { id: 'e5', n: 5, titre: 'Le signe avant le calcul', niv: 2, consigne: 'Sans effectuer le calcul, donne le signe de chaque produit. Calcule ensuite.', items: [
        sg('Signe de $(-2) * (-3) * (-4) * (-5) * (-6)$ ?', 'neg', 'O5', { cor: 'Cinq facteurs négatifs, nombre impair : le produit est négatif.' }),
        sg('Signe de $(-1) * (+2) * (-3) * (+4)$ ?', 'pos', 'O5', { cor: 'Deux facteurs négatifs, nombre pair : le produit est positif.' }),
        sg('Signe de $(-7) * (-7) * (-7)$ ?', 'neg', 'O5', { cor: 'Trois facteurs négatifs : le produit est négatif.' }),
        c('(-2)*(-3)*(-4)*(-5)*(-6)', 'O5'), c('(-1)*(+2)*(-3)*(+4)', 'O5'),
        sg('Un produit comporte 10 facteurs négatifs et aucun facteur nul. Quel est son signe ?', 'pos', 'O5', { cor: '10 est pair, donc le produit est positif. Cette question ne se traite pas par le calcul, seulement par le raisonnement.' })] },
      { id: 'e6', n: 6, titre: 'Enchaînements', niv: 2, consigne: 'Calcule en écrivant une seule opération par ligne sur ton cahier.', items: [c('-5+4*(-3)', 'O7', { nom: 'A' }), c('(-7)*2-(-9)', 'O8', { nom: 'B' }), c('(-12+5)*(-4)', 'O8', { nom: 'C' }), c('36:(-9)+(-2)*(-5)', 'O8', { nom: 'D' }), c('-3*(-4+10)', 'O8', { nom: 'E' }), c('(-2)*(-3)*(-1)+8', 'O8', { nom: 'F' })] },
      { id: 'e7', n: 7, titre: 'Le nombre manquant', niv: 2, consigne: 'Trouve le nombre qui manque.', items: [trou('(-5)+?=-12', 'O2'), trou('?*(-4)=36', 'O4'), trou('(-48):?=6', 'O6'), trou('?-(-7)=3', 'O3'), trou('(-3)*?=0', 'O4'), trou('?+(-9)=0', 'O1', { cor: '$9 + (-9) = 0$ : le nombre manquant est l\'opposé de $-9$.' })] },
      { id: 'e8', n: 8, titre: 'Vrai ou faux ?', niv: 2, consigne: 'Réponds par vrai ou faux. Si c\'est faux, choisis le contre-exemple.', items: [
        vf('La somme de deux nombres négatifs est toujours négative.', true, 'O2', { cor: 'Vrai. En ajoutant deux nombres négatifs, on s\'éloigne de zéro vers la gauche : le résultat est forcément négatif.' }),
        vf('Le produit de deux nombres négatifs est toujours négatif.', false, 'O4', { just: { q: 'Quel calcul le prouve ?', ch: ['$(-2) + (-3) = -5$', '$(-2) * (-3) = 6$', '$(-2) * 3 = -6$'], bon: 1 }, cor: 'Faux. Contre-exemple : $(-2) * (-3) = 6$, qui est positif.' }),
        vf('Si un produit est négatif, alors ses deux facteurs sont négatifs.', false, 'O4', { just: { q: 'Quel calcul le prouve ?', ch: ['$(-2) * 3 = -6$', '$(-2) * (-3) = 6$', '$2 * 3 = 6$'], bon: 0 }, cor: 'Faux. Contre-exemple : $(-2) * 3 = -6$ est négatif, et pourtant un seul des deux facteurs est négatif.' }),
        vf('Le produit d\'un nombre relatif par lui-même n\'est jamais négatif.', true, 'O4', { cor: 'Vrai. Les deux facteurs sont égaux, donc de même signe : le produit est positif, ou nul si le nombre est 0.' }),
        vf('La différence de deux nombres négatifs est toujours négative.', false, 'O3', { just: { q: 'Quel calcul le prouve ?', ch: ['$(-8) - (-3) = -5$', '$(-3) + (-8) = -11$', '$(-3) - (-8) = 5$'], bon: 2 }, cor: 'Faux. Contre-exemple : $(-3) - (-8) = -3 + 8 = 5$, qui est positif.' })] },
      { id: 'e9', n: 9, titre: 'La station météo', niv: 2, probleme: true, consigne: 'Une station relève la température minimale de chaque jour, en degrés Celsius.',
        tableau: { tete: ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'], ligne: ['-3', '-7', '+2', '-5', '0', '+4', '-5'], nom: 'Température (°C)' },
        items: [q('Quel jour a-t-il fait le plus froid ?', ['lundi', 'mardi', 'jeudi', 'dimanche'], 1, 'O1', { cor: 'Le plus froid : mardi, avec $-7$ °C.' }),
          q('Quel jour a-t-il fait le moins froid ?', ['mercredi', 'vendredi', 'samedi', 'lundi'], 2, 'O1', { cor: 'Le moins froid : samedi, avec $+4$ °C.' }),
          n('Calcule l\'écart, en degrés, entre la température la plus élevée et la plus basse.', '11', 'O3', { v: '(+4)-(-7)', fbs: { '-11': 'Tu as soustrait dans le mauvais sens : un écart est positif.', '3': 'Tu as additionné. Un écart se calcule par une soustraction : $(+4) - (-7)$.' }, cor: 'Un écart se calcule par une soustraction : $(+4) - (-7) = 4 + 7 = 11$ °C.' }),
          n('Calcule la température moyenne de la semaine, en degrés.', '-2', 'O6', { v: '((-3)+(-7)+(+2)+(-5)+0+(+4)+(-5)):7', cor: 'Somme des sept relevés : $(-3) + (-7) + (+2) + (-5) + 0 + (+4) + (-5) = -14$.\nMoyenne : $-14 : 7 = -2$ °C. Une moyenne négative est normale ici.' })] },
      { id: 'e10', n: 10, titre: 'Le sous-marin d\'exploration', niv: 2, probleme: true, consigne: 'Un sous-marin d\'exploration se trouve à la profondeur de **$-180$ mètres**. Il effectue alors trois déplacements, dans cet ordre :\n• il **remonte** pendant 4 minutes, à la vitesse de 25 mètres par minute ;\n• il **descend** pendant 6 minutes, à la vitesse de 12 mètres par minute ;\n• il **remonte** enfin de 40 mètres d\'un seul coup.\n\nLa coque du sous-marin ne supporte pas une profondeur inférieure à **$-150$ mètres**.',
        aides: ['Trace un axe vertical et places-y $-180$. Remonter, est-ce ajouter ou enlever ? Descendre, est-ce ajouter ou enlever ?', 'Traite les trois déplacements **l\'un après l\'autre**, en écrivant la profondeur obtenue à chaque étape. Ne cherche pas à tout calculer d\'un seul coup.', 'Pour la limite de sécurité, compare chaque profondeur intermédiaire à $-150$ en les plaçant sur l\'axe. Attention : $-152$ est **plus bas** que $-150$. Pour la dernière question, il reste à parcourir la distance à zéro de la profondeur finale.'],
        items: [n('Profondeur, en mètres, après le premier déplacement ?', '-80', 'O8', { v: '-180+4*25', cor: 'Remonter, c\'est ajouter : $-180 + 4 * 25 = -180 + 100 = -80$.' }),
          n('Profondeur après le deuxième déplacement ?', '-152', 'O8', { v: '-80+6*(-12)', cor: 'Descendre, c\'est ajouter un nombre négatif : $-80 + 6 * (-12) = -80 + (-72) = -152$.' }),
          n('Profondeur à la fin des trois déplacements ?', '-112', 'O8', { v: '-152+40', cor: '$-152 + 40 = -112$.' }),
          q('Le sous-marin a-t-il dépassé sa limite de sécurité au cours du trajet ?', ['Non, jamais', 'Oui, à la fin du premier déplacement', 'Oui, à la fin du deuxième déplacement', 'Oui, à la fin du troisième déplacement'], 2, 'O1',
            { fb: { 0: 'Compare $-152$ et $-150$ sur un axe vertical : $-152$ est plus bas.' }, cor: 'Oui : à la fin du deuxième déplacement, le sous-marin était à $-152$ mètres, or $-152 < -150$. C\'est le seul moment où la limite est franchie.' }),
          n('S\'il remonte ensuite à 28 mètres par minute, en combien de minutes atteindra-t-il la surface ?', '4', 'O6', { v: '112:28', cor: 'Il reste 112 mètres à parcourir, à 28 mètres par minute : $112 : 28 = 4$ minutes.' })] },
      { id: 'e11', n: 11, titre: 'Le jeu du club', niv: 2, probleme: true, consigne: 'Au club jeux du collège, on joue avec des cartes rouges et des cartes noires :\n• chaque carte **rouge** fait **perdre 7 points** ;\n• chaque carte **noire** fait **gagner 4 points**.\n\nEn fin de partie, Lina a 6 cartes rouges et 9 cartes noires. Théo a 11 cartes rouges et 3 cartes noires.',
        aides: ['Combien de points Lina perd-elle avec ses 6 cartes rouges ? Combien en gagne-t-elle avec ses 9 cartes noires ?', 'Le score d\'un joueur s\'écrit avec **deux** produits, puis une addition. Écris le calcul complet avant de le faire.', 'Pour la dernière question, Théo part de $-77$ points. Essaie plusieurs nombres de cartes noires et arrête-toi dès que le score devient positif. Le nombre de cartes est forcément un nombre entier.'],
        items: [n('Quel est le score de Lina ?', '-6', 'O8', { v: '6*(-7)+9*(+4)', cor: '$6 * (-7) + 9 * (+4) = -42 + 36 = -6$.' }),
          n('Quel est le score de Théo ?', '-65', 'O8', { v: '11*(-7)+3*(+4)', cor: '$11 * (-7) + 3 * (+4) = -77 + 12 = -65$.' }),
          q('Qui a gagné la partie ?', ['Lina', 'Théo'], 0, 'O1', { cor: 'Comme $-6 > -65$, c\'est Lina qui gagne.' }),
          n('De combien de points ?', '59', 'O3', { v: '(-6)-(-65)', cor: '$(-6) - (-65) = -6 + 65 = 59$ points d\'avance.' }),
          n('Avec ses 11 cartes rouges, combien de cartes noires Théo aurait-il dû avoir, au minimum, pour obtenir un score positif ?', '20', 'O8', { cor: 'Théo part de $-77$ points. Avec 19 cartes noires : $-77 + 19 * 4 = -1$, encore négatif. Avec 20 : $-77 + 20 * 4 = +3$, positif. Il lui faut au minimum 20 cartes noires.' })] },
      { id: 'e12', n: 12, titre: 'Trois affirmations à examiner', niv: 2, critique: true, consigne: 'Trois affirmations. Pour chacune, teste, puis conclus.',
        aides: ['Affirmation 1 : fais les deux calculs côte à côte, d\'abord en respectant les priorités, puis de gauche à droite. Compare.', 'Affirmation 2 : cherche un calcul avec deux nombres négatifs qui donne un résultat négatif. Essaie avec une addition.', 'Affirmation 3 : place $-5$ et $-9$ sur une droite graduée. Lequel est le plus à droite ?'],
        items: [n('**Affirmation 1 — la méthode d\'un élève.** « Pour calculer une suite d\'opérations, il suffit de faire les calculs dans l\'ordre, de gauche à droite. »\nApplique cette méthode à $10 - 2 * (-6)$. Quel résultat obtient-on ?', '-48', 'O7', { cor: 'De gauche à droite, on obtiendrait $(10 - 2) * (-6) = 8 * (-6) = -48$.' }),
          c('10-2*(-6)', 'O7', { q: 'Calcule maintenant correctement.' }),
          q('La méthode de l\'élève est-elle valable ?', ['Oui', 'Non'], 1, 'O7', { cor: 'Non : la multiplication est prioritaire sur la soustraction.' }),
          q('**Affirmation 2 — trouvée sur un site internet.** « Moins par moins égale plus. »\nPour quel calcul cette phrase donne-t-elle le bon résultat ?', ['$(-3) + (-5)$', '$(-3) * (-5)$', '$(-3) - 5$'], 1, 'O4', { cor: '$(-3) * (-5) = +15$ : la phrase donne bien le bon signe.' }),
          q('Pour quel calcul conduit-elle à une erreur ?', ['$(-3) + (-5)$', '$(-3) * (-5)$', '$(-12) : (-4)$'], 0, 'O2', { cor: '$(-3) + (-5) = -8$ : la phrase conduirait à $+8$, ce qui est faux.' }),
          { k: 'texte', q: 'Réécris la phrase pour qu\'elle devienne toujours correcte.', o: 'O4', modele: '« Le **produit** — ou le **quotient** — de deux nombres **négatifs** est positif. » Le mot qui manquait dans la phrase de départ est le nom de l\'opération.' },
          vf('**Affirmation 3 — le raisonnement de Nour.** « Entre deux nombres négatifs, le plus grand est celui qui a la plus grande distance à zéro. »\nTeste avec $-5$ et $-9$. L\'affirmation est-elle vraie ?', false, 'O1', { cor: '$-9$ a une distance à zéro plus grande que $-5$, et pourtant $-9 < -5$ : l\'affirmation est fausse. Entre deux nombres négatifs, le plus grand est celui dont la distance à zéro est la plus **petite**.' })] },
      { id: 'e13', n: 13, titre: 'Tableur — la table des relatifs', niv: 2, ordi: true, consigne: 'Voici une table de multiplication allant de $-5$ à $+5$ dans les deux sens. Dans un tableur, on la construit en écrivant **une seule formule**, recopiée dans tout le tableau.',
        fig: { t: 'table' },
        items: [q('Les nombres de $-5$ à $+5$ sont en ligne 1 (de B1 à L1) et en colonne A (de A2 à A12). Quelle formule écrire en B2, puis recopier ?', ['=A2*B1', '=\\$A2*B\\$1', '=\\$A\\$2*\\$B\\$1', '=A\\$2*\\$B1'], 1, null, { cor: 'La formule est =\\$A2*B\\$1. Le \\$ devant A bloque la colonne ; le \\$ devant le 1 bloque la ligne.' }),
          q('On colorie en vert les résultats positifs et en rouge les résultats négatifs. Que remarque-t-on ?', ['Tout le tableau est vert', 'Une moitié verte à gauche, une moitié rouge à droite', 'Quatre zones : deux vertes, deux rouges, séparées par une croix de zéros', 'Les couleurs sont mélangées au hasard'], 2, 'O4', { cor: 'On obtient quatre zones : positif en haut à gauche et en bas à droite, négatif dans les deux autres coins, et une croix de zéros au centre. C\'est la règle des signes rendue visible d\'un seul coup d\'œil.' })] },
      { id: 'e14', n: 14, titre: 'Scratch — le sous-marin', niv: 2, ordi: true, consigne: 'Un programme simule le trajet du sous-marin de l\'exercice 10. Deux blocs ont été retirés.',
        script: ['quand le drapeau est cliqué', '[ bloc A retiré ]', 'répéter 4 fois', '    ajouter 25 à profondeur', 'répéter 6 fois', '    [ bloc B retiré ]', 'ajouter 40 à profondeur', 'dire profondeur'],
        items: [q('Quel est le bloc A ?', ['mettre profondeur à 0', 'mettre profondeur à -180', 'ajouter -180 à vitesse', 'répéter 180 fois'], 1, null, { cor: 'C\'est l\'initialisation « mettre profondeur à −180 ». Sans elle, le programme part de zéro.' }),
          q('Quel est le bloc B ?', ['ajouter 12 à profondeur', 'mettre profondeur à -12', 'ajouter -12 à profondeur', 'ajouter -72 à profondeur'], 2, 'O2', { cor: 'À chaque minute de descente, on ajoute $-12$ à la profondeur. Le bloc est répété 6 fois.' }),
          q('On veut afficher « alerte coque » dès que la profondeur devient inférieure à $-150$ mètres. Où placer le test « si profondeur < −150 alors dire alerte coque » ?', ['Avant la première boucle', 'À l\'intérieur de la boucle de descente', 'Tout à la fin du programme'], 1, null, { cor: 'Le test doit être **dans** la boucle de descente. Placé à la fin, il ne détecterait qu\'un dépassement encore présent à l\'arrivée.' }),
          n('On modifie la durée de la descente pour que la limite de sécurité ne soit jamais franchie. Quelle est la durée maximale possible, en minutes entières ?', '5', 'O8', { cor: 'Le sous-marin part de $-80$ après le premier déplacement. À 5 minutes, il est à $-80 + 5 * (-12) = -140$ ; à 6 minutes, à $-152$. La durée maximale est de 5 minutes.' })] },
      { id: 'e15', n: 15, titre: 'Compter sans calculer', niv: 3, plus: true, consigne: 'Ici, impossible de tout calculer : il faut raisonner.', items: [
        n('On multiplie entre eux 2 025 facteurs, tous égaux à $-1$. Quel est le résultat ?', '-1', 'O5', { cor: '2 025 est impair, donc le produit vaut $-1$.' }),
        n('Même question avec 2 026 facteurs.', '1', 'O5', { cor: '2 026 est pair, donc le produit vaut $+1$.' }),
        q('Un produit de plusieurs facteurs non nuls est positif. Que peut-on affirmer avec certitude sur ses facteurs négatifs ?', ['Il n\'y en a aucun', 'Il y en a exactement deux', 'Leur nombre est pair (peut-être zéro)', 'Leur nombre est impair'], 2, 'O5', { cor: 'On peut affirmer que leur nombre est pair, éventuellement nul.' }),
        q('Peut-on connaître leur nombre exact ?', ['Oui', 'Non'], 1, 'O5', { cor: 'Non : un produit positif peut comporter 0, 2, 4… facteurs négatifs. La parité est une information ; elle ne donne pas le nombre.' })] },
      { id: 'e16', n: 16, titre: 'Pourquoi (−1) × (−1) = 1', niv: 3, plus: true, consigne: 'On veut établir ce résultat sans se contenter d\'appliquer la règle des signes.', items: [
        c('(-1)+1', 'O2'),

// ---------- Enregistrement : base de l'artefact (privée par personne) ou, à défaut, cet appareil ----------
const Depot = {
  mode: 'memoire', db: null, base: '', files: {}, statut: null,
  cles: { profil: 'profil', etat: 'ch-' + CH.id },
  async ouvrir() {
    let db = null, uid = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (d && u) { uid = await u.id(); if (uid) db = d; }
      } catch (e) { db = null; }

    if (db) {
      this.base = 'data/users/' + uid + '/';
      try {
        const delai = new Promise((_, rej) => setTimeout(() => rej({ code: 'delai' }), 10000));
        const [p, e] = await Promise.race([Promise.all([db.doc(this.base + this.cles.profil).get(), db.doc(this.base + this.cles.etat).get()]), delai]);
        lu.profil = p.exists ? p.data() : null; lu.etat = e.exists ? e.data() : null;
        this.db = db; this.mode = 'db';

    }

      try {
        for (const k of ['profil', 'etat']) { const t = localStorage.getItem('mathos:' + this.cles[k]); lu[k] = t ? JSON.parse(t) : null; }
        localStorage.setItem('mathos:essai', '1'); this.mode = 'local';

    }
    return lu;
  },
  /** Écrit un document : une écriture à la fois par document, regroupée après une courte pause. */
  sauver(k, donnees) {
    const f = (this.files[k] = this.files[k] || { enCours: false, attente: null, minuteur: null });
    f.attente = donnees;
    clearTimeout(f.minuteur);
    f.minuteur = setTimeout(() => this.vider(k), 700);
    this.signaler('…');
  },
  async vider(k) {
    const f = this.files[k]; if (!f || f.enCours || !f.attente) return;
    const d = JSON.parse(JSON.stringify(f.attente)); f.attente = null; f.enCours = true;
    try {
      if (this.mode === 'db') {
        try { await this.db.doc(this.base + this.cles[k]).set(d); }
        catch (e) {
          if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); await this.db.doc(this.base + this.cles[k]).set(d); }
          else throw e;
        }
      } else if (this.mode === 'local') localStorage.setItem('mathos:' + this.cles[k], JSON.stringify(d));
      this.signaler('ok');
    } catch (e) {
      if (this.mode === 'db') {          // écriture refusée ou base indisponible : on continue sur cet appareil
        this.mode = 'local'; this.db = null;
        try { localStorage.setItem('mathos:' + this.cles[k], JSON.stringify(d)); } catch (e2) { this.mode = 'memoire'; }
        toast('Tes progrès sont enregistrés sur cet appareil seulement.');
      } else this.mode = 'memoire';
      this.signaler('ok');
    }
    f.enCours = false;
    if (f.attente) this.vider(k);
  },
  signaler(s) { this.statut = s; const el = $('#depot'); if (el) el.textContent = this.libelle(); },
  libelle() { return this.statut === '…' ? 'Enregistrement…' : this.mode === 'db' ? 'Progrès enregistrés dans ton espace' : this.mode === 'local' ? 'Progrès enregistrés sur cet appareil' : 'Progrès non enregistrés (stockage indisponible)'; },

function retour() { App.nav = App.pile.pop() || { vue: accueilDe(App.profil.espace), arg: null }; rendre(); }
function allerVers(lien) { const [v, a] = lien.split(':'); aller(v === 'eclair' && a ? 'rituel' : v, a); }
function rendre() {
  arreterMinuteur();
  const v = VUES[App.nav.vue] || VUES.accueil;
  document.documentElement.classList.toggle('tuteur-non', !E.tuteurPermis(App.profil).ok);
  document.documentElement.dataset.taille = App.profil.confort.taille || 0;
  document.documentElement.classList.toggle('aere', !!App.profil.confort.aere);
  $('#app').replaceChildren(entete(), h('main', v(App.nav.arg)), pied());
  window.scrollTo(0, 0);
}
function entete() {
  const esp = App.profil.espace;
  const onglet = (id, nom) => h('button.ong', { type: 'button', 'aria-current': esp === id ? 'page' : null, onclick: () => { App.profil.espace = id; App.sauverProfil(); App.pile = []; App.nav = { vue: accueilDe(id), arg: null }; rendre(); } }, nom);
  const racine = ['accueil', 'parent', 'prof'].includes(App.nav.vue);
  return h('header.haut', h('div.barre',
    racine ? null : h('button.mini', { type: 'button', onclick: retour, 'aria-label': 'Retour', title: 'Retour' }, icone('retour')),
    h('button.marque', { type: 'button', onclick: () => { App.pile = []; App.nav = { vue: accueilDe(esp), arg: null }; rendre(); } }, h('span.logo', { 'aria-hidden': 'true' }, '±'), 'MATHOS'),
    h('nav.ongs', { 'aria-label': 'Espaces' }, onglet('eleve', 'Élève'), onglet('parent', 'Parent'), EXTERNE ? null : onglet('prof', 'Enseignant')),
    h('button.mini', { type: 'button', onclick: () => aller('reglages'), 'aria-label': 'Réglages', title: 'Réglages' }, icone('roue'))));
}
const pied = () => h('footer.pied', h('span#depot', Depot.libelle()), h('span', 'Version d\'essai ' + CT.version));
const anneau = pc => h('div.anneau', { html: `<svg viewBox="0 0 120 120" role="img" aria-label="${pc} % du chapitre"><circle class="fond" cx="60" cy="60" r="50"/><circle class="arc" cx="60" cy="60" r="50" stroke-dasharray="${(pc / 100) * 314.16} 314.16" transform="rotate(-90 60 60)"/><text x="60" y="58">${pc} %</text><text class="p" x="60" y="77">du chapitre</text></svg>` });
const barre = pc => h('span.jauge', h('span', { style: `width:${Math.round(pc * 100)}%` }));
const titre = (t, sur) => [sur ? h('p.sur', sur) : null, h('h1', t)];
const chrono = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const lettre = i => String.fromCharCode(97 + i) + ')';

// ---------- Accueil ----------

  const auj = App.auj(), et = E.etapes(CH, App.etat, auj), suite = E.suite(CH, App.etat, auj), pc = Math.round(E.avancement(CH, App.etat, auj) * 100);

    h('p', EXTERNE ? 'Deux espaces, en haut de l\'écran : Élève pour avancer dans le chapitre, Parent pour suivre les progrès. Les progrès s\'enregistrent tout seuls, sur cet appareil. Sur téléphone, ajoute cette page à l\'écran d\'accueil : MATHOS s\'ouvre alors comme une application.'
      : 'Trois espaces, en haut de l\'écran : Élève pour avancer dans le chapitre, Parent pour suivre les progrès, Enseignant pour l\'atelier. Les progrès s\'enregistrent tout seuls.'),
    h('div.rangchamps', champ('Ta classe', selection('bv-classe', E.CLASSES.map(c => [c, c]), App.profil.classe, v => { App.profil.classe = v; App.sauverProfil(); }))),
    h('div.rang', h('button.btn.pri', { type: 'button', onclick: () => { App.profil.vu.bienvenue = true; App.sauverProfil(); rendre(); } }, 'C\'est parti')));

      h('p.salut', (App.profil.surnom ? `Bonjour ${App.profil.surnom}. ` : '') + suite.pourquoi),
      h('button.btn.pri.grand', { type: 'button', onclick: () => aller(suite.vue) }, (pc ? 'Continuer : ' : 'Commencer : ') + suite.titre, icone('fleche'))), anneau(pc)),
    App.profil.classe !== CH.niveau ? h('p.note', `Les chapitres de ${App.profil.classe} ne sont pas encore chargés. En attendant, tu peux essayer ce chapitre de ${CH.niveau}.`) : null,
    rit && suite.vue !== 'eclair' ? h('button.jour', { type: 'button', onclick: () => aller('rituel', rit.id) }, icone('horloge'), h('span', h('b', 'Calcul éclair du jour'), h('span', ` · ${rit.titre} · 5 minutes`)), icone('fleche')) : null,
    h('section', h('h2', 'Ton chemin dans le chapitre'),

      h('ol.chemin', et.map((s, i) => h('li.' + s.etat + (s.due ? '.due' : ''), h('button', { type: 'button', onclick: () => aller(s.id) },
        h('span.rond', s.etat === 'fait' ? icone('ok') : String(i + 1)),
        h('span.corps', h('b', s.titre), h('span.sous', s.sous), s.n > 1 && s.f > 0 && s.f < s.n ? barre(s.pc) : null),
        h('span.etat', s.due ? 'C\'est le jour' : s.etat === 'fait' ? 'Fait' : s.n > 1 && s.f ? `${s.f} sur ${s.n}` : ''), icone('fleche')))))),
    autres.length ? h('section', h('h2', `Les autres chapitres de ${App.profil.classe}`), h('ul.biblio', autres.map(s => h('li', s.n ? h('span.nch', s.n) : null, s.titre, h('span.avenir', 'à venir')))),
      h('p.petit', 'Ces chapitres existent déjà sous forme de séquences complètes. Ils seront chargés un par un.')) : null,
  ];
};

// ---------- Je fais le point ----------
VUES.point = () => {
  const D = CH.diag;
  if (App.etat.diag) return bilanPoint();
  const zone = h('div.etroit'), rep = new Array(D.items.length).fill(null); let i = 0;
  const pose = () => {
    if (i >= D.items.length) {
      const g = groupeChoix('ptplus', D.enPlus.ch, { cls: 'ligne' });
      return zone.replaceChildren(h('div.carte', riche(D.enPlus.q, 'p'), g.el, h('div.rang', h('button.btn.pri', { type: 'button', onclick: () => {
        const b = E.bilanDiag(CH, rep);
        App.etat.diag = { j: App.auj(), rep, scores: b.scores, total: b.total, parcours: b.parcours, plus: g.lire() };
        App.geste({ t: 'point', s: b.total, n: b.sur }); rendre();
      } }, 'Voir mon bilan'))));
    }
    const it = D.items[i], q = question(it, { id: 'pt' + i, mode: 'fin', nsp: true });
    if (rep[i] !== null) q.poser(rep[i]);
    zone.replaceChildren(h('p.sur', `Question ${i + 1} sur ${D.items.length} · ${D.domaines.find(d => d.id === it.d).nom}`), barre(i / D.items.length), q.el,
      h('div.rang', i ? h('button.btn', { type: 'button', onclick: () => { rep[i] = q.lire(); i--; pose(); } }, 'Précédente') : null,
        h('button.btn.pri', { type: 'button', onclick: () => { const v = q.lire(); if (v === null) return toast('Choisis une réponse, ou « Je ne sais pas ».'); rep[i] = v; i++; pose(); } }, 'Suivante')));
  };
  zone.replaceChildren(h('div.carte', titre('Je fais le point', 'Avant de commencer'), riche(D.intro, 'p'),
    h('p.petit', `${D.items.length} questions · environ ${D.duree} minutes · sans calculatrice`), h('div.rang', h('button.btn.pri', { type: 'button', onclick: pose }, 'Commencer'))));
  return zone;
};
function bilanPoint() {
  const D = CH.diag, d = App.etat.diag, b = E.bilanDiag(CH, d.rep), P = CH.parcours[E.parcours(App.etat)];
  const mots = { acquis: 'Acquis', revoir: 'À revoir', non: 'À reprendre' };
  const detail = h('details.plie', h('summary', 'Voir mes réponses et les corrections'), D.items.map((it, i) => { const q = question(it, { id: 'ptr' + i, mode: 'fin', num: String(i + 1) }); if (d.rep[i] !== null && d.rep[i] !== 'nsp') q.poser(d.rep[i]); q.rendre(E.corriger(it, d.rep[i])); return q.el; }));
  return h('div.etroit', titre('Mon bilan de départ', 'Je fais le point'),
    h('div.carte.accent', h('p.sur', 'Ton parcours'), h('h2', P.nom), h('p', P.mot), h('ul', b.raisons.map(r => h('li', r))),
      d.force ? h('p.petit', 'Ce parcours a été choisi par un adulte.') : null,
      h('p.petit', 'Ce parcours n\'est pas définitif. Tous les exercices restent ouverts, et un adulte peut le changer dans l\'espace Parent.')),
    h('table.bilan', D.domaines.map(dom => h('tr', h('td', dom.nom), h('td.chif', `${b.scores[dom.id]} sur ${b.max[dom.id]}`), h('td', h('span.past.' + b.niveaux[dom.id], mots[b.niveaux[dom.id]]))))),
    D.domaines.filter(dom => b.niveaux[dom.id] !== 'acquis').map(dom => h('div.conseil', h('b', dom.nom + '. '), dom.conseil, ' ', h('button.lien', { type: 'button', onclick: () => allerVers(dom.vers) }, 'Y aller'))),
    riche(D.enPlus.apres, 'p.note'), detail,
    h('div.rang', h('button.btn.pri', { type: 'button', onclick: () => aller('decouvre') }, 'Passer à « Je découvre »'),
      h('button.btn', { type: 'button', onclick: async () => { if (await confirmer('Refaire le point efface ce bilan. Le parcours sera recalculé.', 'Refaire')) { App.etat.diag = null; App.sauver(); rendre(); } } }, 'Refaire le point')));
}

// ---------- Série de questions à validation immédiate ----------
function serieDirecte(items, memo, prefixe, ctx, x = {}) {
  return items.map((it, i) => {
    const rec = (memo[i] = memo[i] || {});
    return question(it, { id: `${prefixe}-${i}`, mode: 'direct', rec, num: x.lettres ? lettre(i) : x.nums ? String(i + 1) : null, exo: x.exo, contexte: ctx,
      surFait: res => { App.geste({ t: 'item', ou: ctx, ok: !!res.ok }); x.surFait && x.surFait(); }, surChange: () => App.sauver() }).el;
  });
}
const finis = (items, memo = {}) => items.every((_, i) => memo[i] && (memo[i].ok || memo[i].co));

// ---------- Je découvre ----------
VUES.decouvre = arg => {
  const A = CH.activite, etat = App.etat.act;
  const p = A.parties.find(x => x.id === arg) || A.parties.find(x => !finis(x.items, etat[x.id])) || A.parties[0], k = A.parties.indexOf(p);
  const memo = (etat[p.id] = etat[p.id] || {});
  const onglets = h('div.onglets', A.parties.map(x => h('button', { type: 'button', 'aria-current': x === p ? 'true' : null, onclick: () => { App.nav.arg = x.id; rendre(); } }, `Partie ${x.id}`, finis(x.items, etat[x.id]) ? icone('ok') : null)));
  const fin = h('div');
  const majFin = () => {
    const tout = A.parties.every(x => finis(x.items, etat[x.id]));
    fin.replaceChildren(finis(p.items, memo) ? h('div.rang', k < A.parties.length - 1 ? h('button.btn.pri', { type: 'button', onclick: () => { App.nav.arg = A.parties[k + 1].id; rendre(); } }, `Partie ${A.parties[k + 1].id}`, icone('fleche')) : h('button.btn.pri', { type: 'button', onclick: () => aller('lecon') }, 'Passer à la leçon', icone('fleche'))) : null,
      tout ? h('div.carte.accent', h('p.sur', 'Ce que j\'ai appris aujourd\'hui'), h('ul', A.bilan.map(l => riche(l, 'li')))) : null);
  };
  majFin();
  return h('div.etroit', titre(A.titre, 'Je découvre'), onglets, h('h2', `Partie ${p.id} — ${p.titre}`), h('div.carte.situation', riche(p.situation, 'div')), p.fig ? figure(p.fig) : null,
    serieDirecte(p.items, memo, 'act' + p.id, `l'activité « ${A.titre} », partie ${p.id}`, { nums: true, surFait: majFin }), fin);
};

// ---------- La leçon ----------
const ETIQ = { def: 'Définition', met: 'Méthode', pro: 'Propriété', ex: 'Exemple', err: 'Erreur fréquente', vig: 'Attention', rem: 'Remarque' };
function bloc(b) {
  if (b.t === 'fig') return figure({ ...b.fig, legende: b.legende });
  return h('div.bloc.' + b.t, h('p.etq', ETIQ[b.t] + (b.nom ? ' ' + b.nom : '') + (b.titre ? ' — ' + b.titre : '')),
    b.faux ? h('div.fj', h('p.fauxl', h('b', 'Faux : '), riche(b.faux)), h('p.justel', h('b', 'Juste : '), riche(b.juste))) : null,
    b.x ? riche(b.x, 'div.txt') : null,
    b.lignes ? h('div.defile', h('table.exs', b.lignes.map(l => h('tr', h('td', riche(l[0])), h('td.com', riche(l[1])))))) : null,
    b.pas ? lignesCalcul(MX.etapes(b.pas), b.nom) : null,
    b.table ? h('div', { html: tableSignes(b.table) }) : null);
}
VUES.lecon = arg => {
  const L = CH.lecon, etat = App.etat.lecon, lu = p => etat[p.id] && etat[p.id].lu;
  const sommaire = courant => h('div.onglets', L.parties.map((x, i) => h('button', { type: 'button', title: x.titre, 'aria-current': x.id === courant ? 'true' : null, onclick: () => { App.nav.arg = x.id; rendre(); } }, String(i + 1), lu(x) ? icone('ok') : null)),
    h('button', { type: 'button', 'aria-current': courant === 'bilan' ? 'true' : null, onclick: () => { App.nav.arg = 'bilan'; rendre(); } }, 'À retenir'));
  if (arg === 'bilan') {
    return h('div.etroit', titre('À retenir', 'La leçon'), sommaire('bilan'), h('div.bloc.bil', h('p.etq', 'L\'essentiel du chapitre'), h('ol', L.bilan.map(l => riche(l, 'li')))),
      h('div.carte', h('p.sur', 'Pourquoi ce chapitre compte'), riche(L.pourquoi, 'p')),
      h('div.rang', h('button.btn.pri', { type: 'button', onclick: () => aller('eclair') }, 'Passer au calcul éclair', icone('fleche'))));
  }
  const p = L.parties.find(x => x.id === arg) || L.parties.find(x => !lu(x)) || L.parties[0], k = L.parties.indexOf(p);
  const e = (etat[p.id] = etat[p.id] || { q: {} });
  const suite = h('div.rang');
  const majSuite = () => {
    if (finis(p.verifie, e.q) && !e.lu) { e.lu = true; App.sauver(); }
    suite.replaceChildren(k ? h('button.btn', { type: 'button', onclick: () => { App.nav.arg = L.parties[k - 1].id; rendre(); } }, 'Partie précédente') : null,
      h('button.btn' + (e.lu ? '.pri' : ''), { type: 'button', onclick: () => { App.nav.arg = k < L.parties.length - 1 ? L.parties[k + 1].id : 'bilan'; rendre(); } }, k < L.parties.length - 1 ? 'Partie suivante' : 'À retenir', icone('fleche')));
  };
  majSuite();
  return h('div.etroit', titre(`${k + 1}. ${p.titre}`, 'La leçon'), sommaire(p.id),
    h('p.jesais', 'Aujourd\'hui : ', p.o.map(o => 'je sais ' + CH.objectifs.find(x => x.id === o).t).join(' ; '), '.'),
    p.blocs.map(bloc),
    h('button.btn.ia', { type: 'button', onclick: () => ouvrirTuteur({ partie: p }) }, icone('bulle'), 'Me l\'expliquer autrement'),
    h('h2', 'Vérifie'), serieDirecte(p.verifie, e.q, 'lec' + p.id, `la leçon, partie ${k + 1} (${p.titre})`, { surFait: majSuite }), suite);
};

// ---------- Série à validation finale (calcul éclair, point, contrôle) ----------
/** cfg : { titre, sur, intro, sections:[{id,titre,sous,consigne,items}], minutes, prefixe, libelle, surFin(rep, resultats, secondes) → Node } */
function serieFinale(cfg) {
  const debut = Date.now(), horloge = h('span.chrono', icone('horloge'), h('span', '0:00')), qs = {};
  if (cfg.minutes) minuteur = setInterval(() => { const s = (Date.now() - debut) / 1000; horloge.lastChild.textContent = `${chrono(s)} / ${cfg.minutes}:00`; horloge.classList.toggle('depasse', s > cfg.minutes * 60); }, 1000);
  const tete = h('div'), corps = h('div', cfg.sections.map(sec => {
    qs[sec.id] = sec.items.map((it, i) => question(it, { id: `${cfg.prefixe}-${sec.id}-${i}`, mode: 'fin', num: String(i + 1) }));
    return h('section.sec', sec.titre ? h('h2', sec.titre, sec.sous ? h('span.pts', sec.sous) : null) : null, sec.consigne ? h('div.carte.situation', riche(sec.consigne, 'div')) : null, qs[sec.id].map(q => q.el));
  }));
  const rendreCopie = async () => {
    const rep = {}; let vides = 0;
    cfg.sections.forEach(sec => { rep[sec.id] = qs[sec.id].map(q => q.lire()); vides += sec.items.filter((it, i) => E.corriger(it, rep[sec.id][i]).vide).length; });
    if (vides && !(await confirmer(`Il reste ${vides} question${vides > 1 ? 's' : ''} sans réponse. Valider quand même ?`, 'Valider'))) return;
    arreterMinuteur();
    const res = {}; cfg.sections.forEach(sec => { res[sec.id] = sec.items.map((it, i) => E.corriger(it, rep[sec.id][i])); qs[sec.id].forEach((q, i) => q.rendre(res[sec.id][i])); });
    bouton.replaceChildren(h('button.btn', { type: 'button', onclick: retour }, 'Retour'));
    tete.replaceChildren(cfg.surFin(rep, res, Math.round((Date.now() - debut) / 1000)));
    window.scrollTo(0, 0);
  };
  const bouton = h('div.rang.bas', h('button.btn.pri.grand', { type: 'button', onclick: rendreCopie }, cfg.libelle || 'Je valide'));
  return h('div.etroit', h('div.entserie', h('div', titre(cfg.titre, cfg.sur)), cfg.minutes ? horloge : null), cfg.intro ? h('p', cfg.intro) : null, tete, corps, bouton);
}
const scoreSerie = res => ({ s: res.filter(r => r.ok).length, n: res.length });
const carteScore = (s, n, texte, extra) => h('div.carte.score', h('p.gros', h('b', String(s)), ` sur ${n}`), h('div', h('p', texte), extra || null));

// ---------- Calcul éclair ----------
VUES.eclair = () => {
  const auj = App.auj(), duJour = E.rituelDuJour(CH, App.etat, auj);
  return h('div.etroit', titre('Calcul éclair', 'Les réflexes du chapitre'),
    h('p', '5 minutes, sans calculatrice, un rituel par jour. Ce n\'est pas noté : ce qui compte, c\'est de progresser d\'une fois à l\'autre.'),
    h('ul.liste', CH.rituels.map((r, i) => { const f = App.etat.rit[r.id]; return h('li', h('button', { type: 'button', onclick: () => aller('rituel', r.id) },
      h('span.rond' + (f ? '.ok' : ''), String(i + 1)), h('span.corps', h('b', r.titre), duJour === r ? h('span.sous', 'Celui d\'aujourd\'hui') : f ? h('span.sous', `Fait ${E.dateFr(f.j)}`) : null),
      f ? h('span.chif', `${f.s} sur ${f.n}`) : null, icone('fleche'))); })),
    h('div.bloc.bil', h('p.etq', 'Les cinq réflexes à installer'), h('ol', CH.reflexes.map(x => riche(x, 'li')))),
    h('div.rang', h('button.btn', { type: 'button', onclick: () => aller('revise') }, 'Le point sur mes automatismes', icone('fleche'))));
};
VUES.rituel = id => {
  const r = CH.rituels.find(x => x.id === id), k = CH.rituels.indexOf(r), avant = App.etat.rit[id];
  return serieFinale({ titre: `Calcul éclair n° ${k + 1}`, sur: r.titre, minutes: 5, prefixe: 'rit' + id, sections: [{ id: 's', items: r.items }],
    surFin: (rep, res, sec) => {
      const { s, n } = scoreSerie(res.s);
      if (!avant) r.items.forEach((it, i) => E.compter(App.etat, it, res.s[i]));
      App.etat.rit[id] = { j: App.auj(), s, n, t: sec, s1: avant ? avant.s1 : s, fois: (avant ? avant.fois : 0) + 1 };
      App.geste({ t: 'rituel', id, s, n });
      const suivant = CH.rituels[k + 1];
      return carteScore(s, n, s === n ? 'Tout juste. Le réflexe est là.' : s >= n - 1 ? 'Presque tout juste. Regarde la question à revoir, juste en dessous.' : 'Regarde les corrections en dessous, puis refais ce rituel demain.',
        h('p.petit', `Temps : ${chrono(sec)}` + (avant ? ` · la première fois : ${avant.s1} sur ${avant.n}` : '') + (suivant ? ` · prochain rituel : n° ${k + 2}, demain` : '')));
    } });
};

// ---------- Je m'entraîne ----------
const NIV = { 1: 'Niveau 1', 2: 'Niveau 2', 3: 'Niveau 3' };
const etiquettes = x => [h('span.tag.n' + x.niv, NIV[x.niv]), x.probleme ? h('span.tag', 'Problème') : null, x.critique ? h('span.tag', 'Esprit critique') : null, x.ordi ? h('span.tag', 'Outil numérique') : null, x.plus ? h('span.tag', 'Pour aller plus loin') : null];
VUES.entraine = () => {
  const L = E.listeExos(CH, App.etat), P = CH.parcours[L.p];
