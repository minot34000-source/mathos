// ---------- Tuteur ----------
const Tut = { ctx: null, tours: [], ctl: null };
const reglesTuteur = () => `Tu es le tuteur de mathématiques de l'application MATHOS. Tu aides un élève de ${App.profil.classe} sur le chapitre « ${CH.titre} ».
Ta façon de faire :
- Tu tutoies l'élève. Phrases courtes, mots simples, 80 mots au plus par réponse.
- Tu guides par des questions, une seule à la fois, en partant de ce que l'élève a écrit.
- Tu ne donnes jamais le résultat de la question en cours. Tu aides à le trouver : rappeler la règle du cours, faire regarder les signes, revenir à la droite graduée, montrer un exemple voisin avec d'autres nombres.
- Quand l'application indique entre crochets qu'une réponse est juste ou fausse, tu t'y fies : c'est elle qui calcule, pas toi.
- ${Cap.outils ? 'Avant d\'écrire le résultat d\'un calcul dans un exemple, appelle l\'outil calculer et recopie sa valeur.' : 'Dans un exemple, choisis des nombres simples et vérifie deux fois ton calcul.'}
- Tu écris les calculs avec les signes − × ÷, sans LaTeX ni Markdown.
- Tu restes sur les mathématiques du chapitre. Pour toute autre demande, tu dis en une phrase que tu es là pour ce chapitre.
- Tu ne demandes aucune information personnelle.
Le cours de l'élève, à reprendre avec ses mots :
${CH.lecon.bilan.map(enClair).join('\n')}
Erreurs fréquentes du chapitre : appliquer « moins par moins » à une addition ; oublier de transformer une soustraction en addition de l'opposé ; calculer de gauche à droite sans respecter les priorités ; croire que −9 est plus grand que −5.`;
function situationTuteur(c) {
  const L = [];
  if (c.item) {
    const it = c.item, r = c.rec || {};
    L.push(`L'élève travaille sur ${c.ou || 'une question'}.`);
    if (c.exo && c.exo.probleme) L.push('Énoncé : ' + enClair(c.exo.consigne));
    L.push('Question en cours : ' + enClair(E.enonce(it)) + (it.k === 'cmp' ? ` ${enClair('$' + MX.ecrireExpr(it.a) + '$')} … ${enClair('$' + MX.ecrireExpr(it.b) + '$')}` : '') + (it.ch ? ' Propositions : ' + it.ch.map(x => enClair(it.k === 'qcmc' ? '$' + x + '$' : x)).join(' | ') : ''));
    L.push(`Essais déjà faits : ${r.es || 0}. Coups de pouce déjà vus : ${r.ai || 0}.`);
    if (r.ok || r.co) L.push(`L'élève connaît maintenant la réponse (${enClair(E.attendu(it))}) : tu peux l'expliquer librement.`);
    else if ((r.es || 0) >= 2) L.push('Après deux essais, tu peux dérouler la méthode complète sur un exemple voisin, puis laisser l\'élève finir sa question. Ne donne toujours pas son résultat.');
    else L.push('Tu ne dois pas donner le résultat de cette question.');
  } else if (c.partie) L.push(`L'élève relit la leçon, partie « ${c.partie.titre} », et demande une autre explication. Texte de la partie : ` + enClair(c.partie.blocs.filter(b => b.x).map(b => b.x).join(' ')).slice(0, 1500));
  return L.join('\n');
}
/** L'application vérifie elle-même une réponse proposée dans le message de l'élève. */
function verdictPourTuteur(c, message) {
  if (!c.item || !['calc', 'num', 'trou'].includes(c.item.k)) return '';
  const m = message.replace(/\s/g, '').match(/^(?:.*?[=:])?\(?([+\-−]?\d+(?:[.,]\d+)?)\)?[.!?]*$/);
  if (!m) return '';
  const res = E.corriger(c.item, m[1]);
  return res.vide ? '' : ` [Application : la réponse ${m[1]} est ${res.ok ? 'juste' : 'fausse'}${res.fb ? ' ; erreur repérée : ' + enClair(res.fb) : ''}]`;
}
function ouvrirTuteur(c) {
  const perm = E.tuteurPermis(App.profil);
  if (!perm.ok) return toast(perm.raison);
  if (!Cap.sample) return toast('Le tuteur n\'est disponible que dans ton espace Claude.');
  if (Tut.ctl) Tut.ctl.abort();
  Tut.ctx = c; Tut.tours = [];
  const fil = h('div.fil', { 'aria-live': 'polite' }), saisie = h('input', { id: 'tut-msg', type: 'text', maxlength: 300, placeholder: 'Écris ta question…', autocomplete: 'off', enterkeyhint: 'send' });
  const compteur = h('span.petit'), bEnvoi = h('button.btn.pri', { type: 'submit' }, 'Envoyer'), bStop = h('button.btn', { type: 'button', hidden: true, onclick: () => Tut.ctl && Tut.ctl.abort() }, 'Arrêter');
  const majCompteur = () => { const q = E.quota(App.etat, App.profil, App.auj()); compteur.textContent = `${q.n} message${q.n > 1 ? 's' : ''} sur ${q.max} aujourd'hui`; return q; };
  const bulle = (qui, texte) => { const b = h('div.bulle.' + qui, texte); fil.append(b); fil.scrollTop = fil.scrollHeight; return b; };
  const envoyer = async texte => {
    texte = texte.trim().slice(0, 300); if (!texte || Tut.ctl) return;
    if (majCompteur().reste <= 0) return bulle('info', 'Tu as utilisé tous tes messages d\'aujourd\'hui. Les coups de pouce et les corrections restent disponibles.');
    bulle('moi', texte); saisie.value = '';
    Tut.tours.push({ role: 'user', content: texte + verdictPourTuteur(c, texte) });
    const b = bulle('lui', 'Je réfléchis…'), ctl = (Tut.ctl = new AbortController());
    bEnvoi.hidden = true; bStop.hidden = false;
    const opts = { cache: false, modelTier: 'quick', signal: ctl.signal, onText: ({ text }) => { b.textContent = text; fil.scrollTop = fil.scrollHeight; } };
    if (Cap.outils) opts.tools = [{ name: 'calculer', description: 'Calcule exactement une expression numérique (nombres relatifs, + - * /, parenthèses) et renvoie sa valeur. À utiliser avant d\'écrire le résultat d\'un calcul dans un exemple.',
      inputSchema: { type: 'object', properties: { expression: { type: 'string', description: 'par exemple (-3)*(-5)+2' } }, required: ['expression'] },
      execute: input => { try { return MX.ecrire(MX.calculerLibre(String(input.expression))); } catch (e) { throw new Error('expression non comprise : écris-la avec des nombres et + - * /'); } } }];
    try {
      const r = await Cap.sample([{ role: 'user', content: reglesTuteur() + '\n\nSituation :\n' + situationTuteur(c) }, ...Tut.tours.slice(-8)], opts);
      b.textContent = r.text; Tut.tours.push({ role: 'assistant', content: r.text });
      const auj = App.auj(); App.etat.tut = { j: auj, n: (App.etat.tut.j === auj ? App.etat.tut.n : 0) + 1 }; App.geste({ t: 'tuteur' });
    } catch (e) {
      Tut.tours.pop();
      const code = e && e.code;
      if (code === 'cancelled' && e.text) b.textContent = e.text;
      else { b.className = 'bulle info'; b.textContent = code === 'cancelled' ? 'Réponse arrêtée.' : code === 'rate_limited' ? 'Le tuteur fait une pause. Réessaie dans quelques minutes.' : code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' ? 'Le tuteur n\'est pas autorisé pour cette page.' : code === 'refused' ? 'Le tuteur ne peut pas répondre à cela.' : 'Le tuteur n\'a pas pu répondre. Réessaie.'; }
    }
    if (Tut.ctl === ctl) Tut.ctl = null;
    bEnvoi.hidden = false; bStop.hidden = true; majCompteur();
  };
  const fermer = () => { if (Tut.ctl) Tut.ctl.abort(); panneau.remove(); };
  const amorces = c.partie ? ['Explique-moi cette partie autrement', 'Donne-moi un autre exemple'] : ['Je ne comprends pas la consigne', 'Par où commencer ?', 'Explique-moi mon erreur'];
  const panneau = h('aside.tut', { id: 'tuteur', 'aria-label': 'Tuteur' },
    h('div.tete', h('div', h('b', 'Tuteur'), h('span.petit', c.item ? enClair(E.enonce(c.item)).slice(0, 70) : c.partie.titre)), h('button.mini', { type: 'button', onclick: fermer, 'aria-label': 'Fermer le tuteur' }, icone('non'))),
    fil, h('div.amorces', amorces.map(a => h('button.puce', { type: 'button', onclick: () => envoyer(a) }, a))),
    h('form.envoi', { onsubmit: ev => { ev.preventDefault(); envoyer(saisie.value); } }, saisie, bEnvoi, bStop), compteur);
  const ancien = $('#tuteur'); if (ancien) ancien.remove();
  document.body.append(panneau);
  bulle('info', 'Je suis une intelligence artificielle : je peux me tromper, la correction de l\'application fait foi. Je ne donne pas la réponse, je t\'aide à la trouver.');
  majCompteur(); saisie.focus();
}

// ---------- Démarrage ----------
const estObjet = x => !!x && typeof x === 'object' && !Array.isArray(x);
/** Un état enregistré n'est repris que s'il a la forme attendue (stockage abîmé, sauvegarde importée). */
function etatValide(e) {
  return estObjet(e) && e.v === 1 && ['act', 'lecon', 'rit', 'exo', 'fiche', 'obj', 'err', 'tut'].every(k => estObjet(e[k])) && ['point', 'ctrl', 'journal'].every(k => Array.isArray(e[k]));
}
function normaliserProfil(p) {
  const P0 = E.profilVide(); p = estObjet(p) ? p : {};
  const r = { ...P0, ...p, tuteur: { ...P0.tuteur, ...(estObjet(p.tuteur) ? p.tuteur : {}) }, confort: { ...P0.confort, ...(estObjet(p.confort) ? p.confort : {}) }, vu: { ...(estObjet(p.vu) ? p.vu : {}) } };
  if (!E.CLASSES.includes(r.classe)) r.classe = P0.classe;
  if (!['eleve', 'parent', 'prof'].includes(r.espace) || (EXTERNE && r.espace === 'prof')) r.espace = 'eleve';
  r.surnom = String(r.surnom || '').slice(0, 20); r.decalage = Math.max(0, Math.min(400, Math.round(+r.decalage || 0)));
  return r;
}
async function demarrer() {
  const racine = $('#app');
  racine.replaceChildren(h('div.attente', h('span.logo', { 'aria-hidden': 'true' }, '±'), h('p', 'Ouverture de ton espace…')));
  const lu = await Depot.ouvrir();
  App.profil = normaliserProfil(lu.profil);
  App.etat = etatValide(lu.etat) ? { ...E.etatVide(), ...lu.etat } : E.etatVide();
  if (EXTERNE && navigator.storage && navigator.storage.persist && window.matchMedia('(display-mode: standalone)').matches) navigator.storage.persist().catch(() => {});
  App.nav = { vue: accueilDe(App.profil.espace), arg: null };
  rendre();
  chargerCapacites();
  document.addEventListener('visibilitychange', () => { if (document.hidden) ['etat', 'profil'].forEach(k => { const f = Depot.files[k]; if (f && f.attente) { clearTimeout(f.minuteur); Depot.vider(k); } }); });
}
demarrer();

})();
